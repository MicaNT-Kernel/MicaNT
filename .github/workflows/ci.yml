name: MicaNT Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-windows-clang:
    name: Build & Run Test Battery (Windows Clang C++23)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Output Directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path bin

      - name: Compile Modular Kernel Subsystems & Test Runner (Clang C++23)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          clang++ -O2 -D_CRT_SECURE_NO_WARNINGS test/unmodified_crt_sample.cpp -o bin/unmodified_crt_sample.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $kernelUnits = Get-ChildItem -Recurse kernel -Filter *.cpp | Where-Object { $_.Name -ne "kiinit.cpp" } | Sort-Object FullName
          $objFiles = @()
          foreach ($unit in $kernelUnits) {
              $subsys = $unit.Directory.Name
              $base   = [System.IO.Path]::GetFileNameWithoutExtension($unit.Name)
              $objOut = "bin/${subsys}_${base}.o"
              Write-Host "[CI] Compiling $($unit.FullName) -> $objOut"
              clang++ -std=c++23 -D_CRT_SECURE_NO_WARNINGS -c -Iinclude $unit.FullName -o $objOut
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $objFiles += $objOut
          }

          Write-Host "[CI] Linking bin/micant_kernel.exe ($($objFiles.Count) modular kernel object units)..."
          clang++ -std=c++23 -D_CRT_SECURE_NO_WARNINGS -Iinclude kernel/init/kiinit.cpp @objFiles -o bin/micant_kernel.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "[CI] Linking bin/micant_tests.exe ($($objFiles.Count) modular kernel object units)..."
          clang++ -std=c++23 -D_CRT_SECURE_NO_WARNINGS -Iinclude test/test_runner.cpp @objFiles -o bin/micant_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute Full Test Battery, Kernel Boot Self-Test & Clean-Room Sentinel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\bin\micant_kernel.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\micant_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/clean_room_sentinel.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
