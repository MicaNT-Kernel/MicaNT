name: MicaNT Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-windows-clang:
    name: Build & Run Test Battery (Windows Clang C++23)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Output Directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path bin

      - name: Compile Test Runner & Fixtures (Clang C++23)
        shell: pwsh
        run: |
          clang++ -O2 -D_CRT_SECURE_NO_WARNINGS test/unmodified_crt_sample.cpp -o bin/unmodified_crt_sample.exe
          clang++ -std=c++23 -D_CRT_SECURE_NO_WARNINGS -c -Iinclude kernel/dispatcher.cpp -o bin/dispatcher.o
          clang++ -std=c++23 -D_CRT_SECURE_NO_WARNINGS -c -Iinclude kernel/syscalls.cpp -o bin/syscalls.o
          clang++ -std=c++23 -D_CRT_SECURE_NO_WARNINGS -Iinclude test/test_runner.cpp bin/dispatcher.o bin/syscalls.o -o bin/micant_tests.exe

      - name: Execute Full 226-Suite Test Battery (100% Pass Rate Required)
        shell: pwsh
        run: |
          .\bin\micant_tests.exe
